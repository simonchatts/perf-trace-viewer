name: CI and release assets

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  CI:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Unit tests for parse_perf_script.py
        run: python3 perf_trace_viewer/parse_perf_script.py

      - name: Unit tests for parse_mdata.py
        run: python3 perf_trace_viewer/parse_mdata.py

      - name: Unit tests for quantized.py
        run: python3 perf_trace_viewer/quantized_test.py

      - name: Install dependencies
        run: pip install mypy ruff

      - name: Check changed Python with Ruff
        run: |
          ruff check --select E,F,I perf_trace_viewer/quantized.py perf_trace_viewer/quantized_test.py perf_trace_viewer/__main__.py perf_trace_viewer/parse_jsonl.py
          ruff format --check perf_trace_viewer/quantized.py perf_trace_viewer/quantized_test.py perf_trace_viewer/__main__.py perf_trace_viewer/parse_jsonl.py

      - name: Check types
        run: mypy --strict perf_trace_viewer

      - name: Check the collection script
        run: shellcheck --shell=bash collect

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check and build the web viewer
        run: |
          npm ci
          npm run format:check
          npm run typecheck
          npm run build
          grep -Eq 'assets/index-[^" ]+\.js' dist/sw.js
          grep -Eq 'assets/index-[^" ]+\.css' dist/sw.js
          grep -q 'index.html' dist/sw.js
          grep -q 'manifest.webmanifest' dist/sw.js
          test -x dist/serve_ui.py
          python3 dist/serve_ui.py --help

      - name: Package the static web viewer
        run: tar -C dist -czf perf-trace-viewer-web.tar.gz .

      - name: Prepare standalone scripts
        run: |
          mkdir release-assets
          cp collect perf-trace-viewer-web.tar.gz release-assets/
          # We've done all the tests, so can delete any
          # test-only modules before zipping up.
          rm -f perf_trace_viewer/*test*.py
          python3 -m zipapp perf_trace_viewer \
            --output=release-assets/perf_trace_viewer \
            --python="/usr/bin/env python3"

      - name: Test standalone script
        run: ./release-assets/perf_trace_viewer --help

      - name: Upload candidate release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          if-no-files-found: error
          # Upload the staged files without including the staging directory.
          path: release-assets/*

  verify_release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code and main branch history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [CI, verify_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: release-assets

      - name: Restore executable permissions
        run: chmod +x collect perf_trace_viewer

      - name: Add assets to tagged release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            collect
            perf_trace_viewer
            perf-trace-viewer-web.tar.gz

permissions:
  contents: read
